<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spökhusdetaljer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>Spökhusbyrån AB</h1>
        <nav>
          <a href="index.html">Alla spökhus</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="back-link-wrapper">
        <a class="back-link" href="index.html">← Tillbaka till översikten</a>
      </div>

      <div id="house-error"></div>

      <section id="house-details"></section>

      <section id="weather-section" class="weather-section hidden">
        <h2>Aktuellt väder</h2>
        <div id="weather-content"></div>
      </section>

      <section id="booking-section" class="booking-section hidden">
        <h2>Boka din vistelse</h2>

        <form id="booking-form" class="booking-form" novalidate>
          <div class="form-group">
            <label for="checkin">Incheckningsdatum</label>
            <input type="date" id="checkin" required />
          </div>

          <div class="form-group">
            <label for="days">Antal dagar</label>
            <input type="number" id="days" min="1" value="1" required />
          </div>

          <fieldset class="extras-fieldset">
            <legend>Tillägg</legend>

            <label>
              <input type="checkbox" name="extras" value="breakfast" />
              Frukost (+100 kr/dag)
            </label>

            <label>
              <input type="checkbox" name="extras" value="ghostTour" />
              Spökvandring (+300 kr)
            </label>

            <label>
              <input type="checkbox" name="extras" value="seance" />
              Nattlig seans (+500 kr)
            </label>
          </fieldset>

          <div class="form-group">
            <label for="promo">Kampanjkod</label>
            <input type="text" id="promo" placeholder="t.ex. GHOST20" />
          </div>

          <div class="price-box">
            <p>Totalpris: <strong id="total-price">0 kr</strong></p>
          </div>

          <div id="booking-errors"></div>

          <button type="submit" class="btn">Boka</button>
        </form>

        <div id="booking-confirmation"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Spökhusbyrån AB</p>
      </div>
    </footer>

    <script type="module" src="house.js"></script>
  </body>
</html>
